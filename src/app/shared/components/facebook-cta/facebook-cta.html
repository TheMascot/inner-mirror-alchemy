<section class="cta" id="csoport" aria-labelledby="cta-heading">
  <div class="container cta__inner">
    <span class="kicker cta__kicker">A következő lépés</span>
    <h2 class="cta__heading" id="cta-heading">
      Lehet, hogy nem egy újabb kapcsolat hiányzik az életedből.<br />
      Hanem egy új irány.
    </h2>
    <p class="cta__text">
      Csatlakozz a Facebook™-csoporthoz, ahol párkapcsolati önismeretről beszélgetünk az asztrológia tükrében.
    </p>
    <a [href]="facebookUrl" target="_blank" rel="noopener noreferrer" class="btn cta__btn">
      KÉREM A MEGHÍVÓMAT, BOLDOG PÁRKAPCSOLATRA VÁGYOM!
    </a>
  </div>
</section>
